name: ci

# Per-push / PR quality gate for the renderer-SSoT verification assets:
#   1. unit suites   — jui_tools (unittest discovery) + rspec x3 (sjui/kjui/rjui)
#   2. SSoT guards   — fixture freshness + attr-bindings determinism + vendored
#                      ruby attr tables freshness
#   3. web conformance — full fixture suite through rjui codegen + React +
#                      headless Chromium (gate: 0 fail / 0 error)
#
# The former protocol-sync workflow is folded into the python-suite job here
# (see .github/workflows/README.md). Mobile (iOS/Android) conformance is too
# slow for per-push: see conformance-mobile.yml (weekly + manual dispatch).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ #
  # Publication hygiene. Structural rules, stated without naming any
  # downstream identifier — spelling the vocabulary out here would be the
  # leak it is meant to prevent. The vocabulary check itself runs in the
  # pre-commit hook, whose pattern list lives outside every repository.
  #
  #   1. docs/ is gitignored because bug reports quote downstream app names
  #      and local paths; a force-add slips past the ignore rule silently,
  #      so the tracked set is asserted here instead.
  #   2. dev-guide/ is the PUBLISHED maintainer guide (moved out of docs/
  #      2026-08-01): it must stay tracked — an ignore-rule mistake would
  #      silently unpublish it — and docs/dev-guide must not come back,
  #      or the two copies drift.
  #   3. No absolute home paths: they carry a username and a machine layout.
  #      (This repo-wide grep is also what audits dev-guide content.)
  # ------------------------------------------------------------------ #
  publication-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docs/ stays untracked
        run: |
          tracked=$(git ls-files docs/ || true)
          if [ -n "$tracked" ]; then
            echo "::error::docs/ is ignored but these files are tracked:"
            echo "$tracked"
            exit 1
          fi
      - name: dev-guide/ stays tracked, with no shadow copy under docs/
        run: |
          tracked=$(git ls-files dev-guide/ || true)
          if [ -z "$tracked" ]; then
            echo "::error::dev-guide/ has no tracked files — the maintainer guide got unpublished"
            exit 1
          fi
          if [ -e docs/dev-guide ]; then
            echo "::error::docs/dev-guide reappeared — dev-guide/ is the only master (see docs/README.md)"
            exit 1
          fi
      - name: No absolute home paths in tracked files
        run: |
          # Anchored so a directory that merely ends in /home/ (a layout
          # folder, say) is not mistaken for an absolute home path.
          hits=$(git grep -I -n -E '(^|[^A-Za-z0-9_./-])/(Users|home)/[a-z0-9._-]+/' -- . \
                 ':(exclude).github/workflows/*' || true)
          if [ -n "$hits" ]; then
            echo "::error::absolute home paths are machine-specific:"
            echo "$hits"
            exit 1
          fi

  # ------------------------------------------------------------------ #
  # jui_tools unit suite + protocol-sync idempotency (folded from the
  # old protocol-sync.yml — CI intentionally uses unittest discovery).
  # ------------------------------------------------------------------ #
  python-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        run: python -m pip install --upgrade pip && python -m pip install -e .
      # Both install BEFORE the jui_tools suite runs. `jui g project`
      # validates specs only when document_tools imports, so with the
      # installs after the suite, that validation never ran here — and a
      # test whose fixture specs were invalid passed for a month because the
      # check was absent rather than satisfied.
      # test_tools installs BEFORE document_tools: jsonui_doc_cli imports the
      # validator + schema constants from jsonui_test_cli (single in-repo copy).
      - name: Install test_tools (dev)
        working-directory: test_tools
        run: python -m pip install -e ".[dev]"
      - name: Install document_tools (dev)
        working-directory: document_tools
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: jui_tools
        run: python -m unittest discover -s tests -v
      - name: Protocol sync idempotency (e2e)
        # Runs the protocol sync twice against the fixture project and ensures
        # no files change the second time — the structural guard against
        # non-deterministic generation.
        working-directory: jui_tools
        run: python -m unittest tests.test_build_sync_e2e.SyncProtocolE2ETests.test_idempotency
      - name: Run test_tools tests
        working-directory: test_tools
        run: python -m pytest
      - name: Run document_tools tests
        working-directory: document_tools
        run: python -m pytest

  # ------------------------------------------------------------------ #
  # Ruby codegen unit suites. sjui_tools has no Gemfile (plain rspec);
  # kjui/rjui use their committed Gemfile.lock via bundler-cache.
  # ------------------------------------------------------------------ #
  ruby-suites:
    name: rspec (${{ matrix.tool }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: sjui_tools
            bundler: false
            os: macos-15 # specs compile emitted Swift against the SwiftUI SDK
          - tool: kjui_tools
            bundler: true
            os: ubuntu-latest
          - tool: rjui_tools
            bundler: true
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: ${{ matrix.bundler }}
          working-directory: ${{ matrix.bundler && matrix.tool || '' }}
      - name: Install gems (no Gemfile)
        # sjui_tools has no Gemfile; its specs need rspec + simplecov and the
        # non-default gems its lib requires (xcodeproj, listen).
        if: ${{ !matrix.bundler }}
        run: gem install rspec simplecov xcodeproj listen --no-document
      - name: rspec (bundle)
        if: ${{ matrix.bundler }}
        working-directory: ${{ matrix.tool }}
        run: bundle exec rspec
      - name: rspec
        if: ${{ !matrix.bundler }}
        working-directory: ${{ matrix.tool }}
        run: rspec

  # ------------------------------------------------------------------ #
  # Drift guards between shared/core/attribute_definitions.json and the
  # committed generated assets.
  # ------------------------------------------------------------------ #
  ssot-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Fixture freshness (jui conformance generate produces zero diff)
        run: |
          python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['conformance','generate']))"
          git diff --exit-code -- conformance/
          if [ -n "$(git status --porcelain -- conformance/)" ]; then
            echo "::error::jui conformance generate left new/untracked files under conformance/"
            git status --porcelain -- conformance/
            exit 1
          fi
      - name: attr-bindings determinism (two runs emit identical output)
        run: |
          python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['generate','attr-bindings','--lang','all']))"
          mv build/attr_codegen build/attr_codegen.run1
          python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['generate','attr-bindings','--lang','all']))"
          diff -r build/attr_codegen.run1 build/attr_codegen
      - name: Vendored ruby attr tables match fresh emit
        # rjui_tools vendors the generated ruby extraction tables; README.md
        # is the (hand-written) provenance note and is excluded.
        run: diff -r -x README.md build/attr_codegen/ruby rjui_tools/lib/core/generated/attributes
      - name: attr-codegen manifest freshness (committed manifest matches fresh emit)
        # The determinism step above just re-emitted build/attr_codegen,
        # including manifest.json (the only committed file under build/).
        # SwiftJsonUI / KotlinJsonUI CI verify their vendored swift/kotlin
        # tables against this manifest at a pinned ref, so a stale or
        # missing committed copy would silently disarm that cross-repo
        # guard — fail here instead. Re-vendor and manifest belong in the
        # same commit.
        run: |
          git ls-files --error-unmatch build/attr_codegen/manifest.json
          git diff --exit-code -- build/attr_codegen/manifest.json
      - name: Attribute coverage ratchet (declared attributes each platform reads)
        # The conformance suite compares each platform against its own previous
        # screenshot, so an attribute no converter reads renders blank, matches
        # its blank baseline and passes. This is the static backstop: a newly
        # declared attribute nobody wired up, or a closed gap left in the
        # ledger, fails here. See conformance/coverage.json.
        run: |
          python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['conformance','coverage']))"

  # ------------------------------------------------------------------ #
  # Web conformance: the full generated fixture suite through the real
  # production path (rjui codegen -> React -> Playwright, headless).
  # Gate: zero fail / zero error in web.results.json.
  # ------------------------------------------------------------------ #
  web-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # scripts/run.ts relies on native TS type stripping (Node >= 23)
          cache: npm
          cache-dependency-path: conformance/hosts/web/package-lock.json
      - uses: ruby/setup-ruby@v1 # rjui_tools codegen inside generate.sh
        with:
          ruby-version: "3.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        # [conformance] pulls in Pillow — the per-push web lane compares
        # screenshots against baselines/ci/web.hashes.json (see the gate
        # step); without it the comparison silently never runs.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[conformance]'
      - name: npm ci
        working-directory: conformance/hosts/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: conformance/hosts/web
        run: npx playwright install --with-deps chromium
      - name: Generate fixtures into the host (rjui codegen)
        working-directory: conformance/hosts/web
        run: ./generate.sh
      - name: Typecheck — generated code must have zero type errors
        # The host is the production rjui codegen output, so a type error here
        # is one in every consumer's @generated tree, which nobody downstream
        # can patch.
        #
        # This was a RATCHET while the count was being worked down: the errors
        # had three independent owners, so gating on zero would have left the
        # hole open (plan 37). The count reached zero (plan 44 Phase 2), and a
        # ratchet pinned at zero is just a plain typecheck with a second file
        # to keep in sync — so the baseline and the ratchet script are gone
        # and this is the gate they were building toward (plan 44 Phase 4).
        working-directory: conformance/hosts/web
        run: npm run typecheck
      - name: Run web conformance suite
        working-directory: conformance/hosts/web
        run: npm run conformance
      - name: Gate — fail/error + visual vs baselines/ci/web (jui conformance gate)
        # Renders REPORT.md (fresh web results merged with the committed
        # iOS/Android results) and judges --platform web only: the committed
        # mobile screenshots are not on this runner. Visual checks are ON
        # with --env ci (plan 25 Phase C): this runner and the mobile lane's
        # web job are the same renderer class (ubuntu + pinned Chromium), so
        # both compare against baselines/ci/web.hashes.json. When a push
        # changes the fixture set, this lane goes red on no_baseline — bake
        # from THIS lane's uploaded artifacts (never a local render):
        #   jui conformance baseline update --platform web --env ci \
        #     --artifacts <downloaded>/artifacts/web
        # and commit baselines/ci/web.hashes.json with the change.
        # Same command runs locally; logic lives in
        # jui_tools/jui_cli/conformance/gate.py (tests: test_conformance_gate).
        run: python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['conformance','gate','--platform','web','--env','ci']))"
      - name: Upload results + report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-conformance
          if-no-files-found: error
          path: |
            conformance/REPORT.md
            conformance/results/web.results.json
            conformance/artifacts/web/

  # ------------------------------------------------------------------ #
  # Ruby generation parity.
  #
  # `kjui` runs under the HOST'S system Ruby in consumer projects, which on
  # macOS is 2.6 (kjui_tools/lib/compose/helpers/section_extractor.rb:625
  # states the contract). CI runs 3.3. Those are different interpreters
  # generating the code a consumer ships, and nothing was comparing them.
  #
  # rjui_tools/spec/react/ruby_baseline_spec.rb already forbids 2.7+ APIs, so
  # the "wrote filter_map" family is covered. This job covers the other one:
  # the SAME source behaving differently between interpreters — Ruby 3.0's
  # keyword-argument separation above all, plus Hash ordering and String
  # changes. Those produce no syntax error and no failing unit test; they
  # produce a different file.
  #
  # It is worth wiring even though the current diff is empty. A consumer's
  # system Ruby does not move, but CI's does — so the day a difference
  # appears is a day nobody is looking at this.
  #
  # ubuntu-24.04 is PINNED, not ubuntu-latest. ruby/ruby-builder publishes no
  # ubuntu-26.04 assets at all (measured: 94 for 24.04, 94 for 22.04, 0 for
  # 26.04), so the day the `latest` label moves this job would stop being able
  # to fetch 2.6 — and would leave behind a green record claiming 2.6 parity
  # is checked.
  # ------------------------------------------------------------------ #
  ruby-generation-parity:
    name: kjui generates the same bytes on Ruby 2.6 and 3.3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: main
          path: KotlinJsonUI

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.6.10"
      - name: Generate with Ruby 2.6
        env:
          CONFORMANCE_DIR: ${{ github.workspace }}/conformance
          KJUI_TOOLS_PATH: ${{ github.workspace }}/kjui_tools
        run: |
          ruby -v
          ruby KotlinJsonUI/conformance-host/scripts/generate_codegen_host.rb
          mv KotlinJsonUI/conformance-host/src/codegen/kotlin "$RUNNER_TEMP/out26"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Generate with Ruby 3.3
        env:
          CONFORMANCE_DIR: ${{ github.workspace }}/conformance
          KJUI_TOOLS_PATH: ${{ github.workspace }}/kjui_tools
        run: |
          ruby -v
          ruby KotlinJsonUI/conformance-host/scripts/generate_codegen_host.rb
          mv KotlinJsonUI/conformance-host/src/codegen/kotlin "$RUNNER_TEMP/out33"

      - name: Compare
        # The count check comes FIRST and is the point: `diff -r` returns 0
        # for two empty trees, so a run where generation failed on both sides
        # — or produced a stub on one — would report parity it never measured.
        # Same shape as the fixture lane's `assert len(names) > 400`.
        run: |
          MIN_KT=2000   # 2557 at the time of writing; a floor fixture growth cannot trip
          for t in out26 out33; do
            n=$(find "$RUNNER_TEMP/$t" -name '*.kt' | wc -l)
            echo "$t: $n .kt files"
            if [ "$n" -lt "$MIN_KT" ]; then
              echo "::error::$t holds $n .kt files (< $MIN_KT) — generation did not run, so there is nothing to compare"
              exit 1
            fi
          done
          diff -r "$RUNNER_TEMP/out26" "$RUNNER_TEMP/out33"
          echo "identical on both interpreters"
