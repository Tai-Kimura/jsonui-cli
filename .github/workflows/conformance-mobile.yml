name: conformance-mobile

# Full 3-platform conformance run (iOS + Android + Web) with the combined
# cross-platform report as the gate: 0 mismatches / 0 fail / 0 error.
#
# Too slow for per-push (iOS ~30 min on a macOS runner, Android needs an
# emulator boot), so it runs weekly + on manual dispatch. Per-push coverage
# is ci.yml (unit suites + guards + web conformance). For an on-demand full
# run (e.g. before a release), use workflow_dispatch.
#
# The iOS host lives in the SwiftJsonUI repo (ConformanceHost/), the Android
# host in the KotlinJsonUI repo (conformance-host/) — both public and checked
# out read-only alongside this repo. The iOS UITest driver is vendored at
# sync time from the public jsonui-test-runner repo; the Android host commits
# its vendored driver.

on:
  schedule:
    # Sunday 18:00 UTC = Monday 03:00 JST — weekly, results ready before the
    # work week starts.
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: conformance-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Web — rerun (not reuse a stale artifact) so all three results in the
  # report come from the same commit's fixtures. Same steps as ci.yml's
  # web-conformance job minus the per-platform gate (the report job gates).
  # ------------------------------------------------------------------ #
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # scripts/run.ts relies on native TS type stripping (Node >= 23)
          cache: npm
          cache-dependency-path: conformance/hosts/web/package-lock.json
      - uses: ruby/setup-ruby@v1 # rjui_tools codegen inside generate.sh
        with:
          ruby-version: "3.3"
      - name: Drop the checked-out results file
        # Every results file in this repo is TRACKED, so a checkout puts a
        # PREVIOUS campaign's results on disk before this job measures
        # anything. When a run dies before its collect step, the upload below
        # still finds that file, `if-no-files-found: error` is satisfied, and
        # the artifact reads as a successful suite — mobile run 30912810635
        # shipped plan 32's "pass: 478" as though android-codegen had run,
        # while the lane had produced zero screenshots. Delete it first so the
        # artifact can only ever contain THIS run's product.
        run: rm -f conformance/results/web.results.json
      - name: npm ci
        working-directory: conformance/hosts/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: conformance/hosts/web
        run: npx playwright install --with-deps chromium
      - name: Generate fixtures into the host (rjui codegen)
        working-directory: conformance/hosts/web
        run: ./generate.sh
      - name: Run web conformance suite
        working-directory: conformance/hosts/web
        run: npm run conformance
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          if-no-files-found: error
          path: |
            conformance/results/web.results.json
            conformance/artifacts/web/

  # ------------------------------------------------------------------ #
  # iOS — SwiftJsonUI Dynamic mode host, headless xcodebuild test on a
  # simulator. Xcode is pinned so the simulator runtime is deterministic.
  # ------------------------------------------------------------------ #
  ios:
    runs-on: macos-15
    # 2026-08-07 (plan 51-H) re-measure — held, with the reading recorded so
    # the next resize starts from a number instead of re-deriving one.
    # Measured 41 min (run 31135850340, green) and 36 min (31088841656) of
    # 90. iOS-eligible fixtures go to 958 with the Wave 3 expansion (+13%
    # on the manifest), putting it near 47 — still ~1.9x headroom, and the
    # simulator has no degraded-runner attempt loop to absorb like Android's.
    timeout-minutes: 90
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      JSONUI_TEST_RUNNER_PATH: ${{ github.workspace }}/jsonui-test-runner
    outputs:
      library_sha: ${{ steps.library_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/SwiftJsonUI
          ref: master
          path: SwiftJsonUI
      - name: Record the SwiftJsonUI commit these pixels were drawn by
        id: library_sha
        run: echo "sha=$(git -C SwiftJsonUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/jsonui-test-runner
          path: jsonui-test-runner
          # drivers/ios is a submodule since test-runner 61a860e — without this
          # the vendor step finds an empty gitlink and fails
          submodules: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - uses: ruby/setup-ruby@v1 # generate_project.rb needs the xcodeproj gem
        with:
          ruby-version: "3.3"
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Sync fixtures + vendor the iOS test-runner driver
        run: SwiftJsonUI/ConformanceHost/scripts/sync_fixtures.sh
      - name: Generate ConformanceHost.xcodeproj
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_project.rb
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/results/ios.results.json
      - name: Run iOS conformance suite (headless simulator)
        env:
          SIMULATOR_NAME: iPhone 16 Pro
        run: SwiftJsonUI/ConformanceHost/scripts/run_conformance.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          if-no-files-found: error
          path: |
            conformance/results/ios.results.json
            conformance/artifacts/ios/

  # ------------------------------------------------------------------ #
  # iOS codegen — the SAME fixtures through the sjui-GENERATED SwiftUI
  # views (production pipeline). Screenshots feed `gate --parity`, which
  # compares them against the dynamic baselines: dynamic ≡ codegen as a
  # judged invariant instead of maintainer working memory (plan 25 A).
  # ------------------------------------------------------------------ #
  ios-codegen:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      JSONUI_TEST_RUNNER_PATH: ${{ github.workspace }}/jsonui-test-runner
      SJUI_TOOLS_PATH: ${{ github.workspace }}/sjui_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/SwiftJsonUI
          ref: master
          path: SwiftJsonUI
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/jsonui-test-runner
          path: jsonui-test-runner
          submodules: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Sync fixtures + vendor the iOS test-runner driver
        run: SwiftJsonUI/ConformanceHost/scripts/sync_fixtures.sh
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/codegen/ios.results.json
      - name: Generate the codegen fixture registry (sjui build)
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_codegen_host.rb
      - name: Generate ConformanceHost.xcodeproj (codegen sources)
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_project.rb
      - name: Run iOS codegen suite (headless simulator)
        env:
          SIMULATOR_NAME: iPhone 16 Pro
          HOST_MODE: codegen
        run: SwiftJsonUI/ConformanceHost/scripts/run_conformance.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios-codegen
          if-no-files-found: error
          path: |
            conformance/codegen/ios.results.json
            conformance/artifacts/ios-codegen/

  # ------------------------------------------------------------------ #
  # Android — KotlinJsonUI Compose dynamic host on a headless emulator
  # (KVM-accelerated on ubuntu-latest). Tablet profile matches the
  # committed baseline runs (small phones can push fixtures offscreen).
  # ------------------------------------------------------------------ #
  android:
    runs-on: ubuntu-latest
    # Suite duration (full 672-fixture set incl. interactive + screenshots;
    # 2026-07-24: +4 assertable Embed fixtures + 2 companion layouts — local
    # conf AVD assertable pass stayed ~58s/attempt, so +4 text-assert
    # fixtures ≈ +5-10s local → ≪1 min even at the 5-7x CI multiplier;
    # 2026-07-24 (2): +2 interactive tap-driven Embed fixtures (isolated
    # push/pop) + 1 companion — local conf AVD full sweep 250s vs 226s at
    # 643 fixtures, i.e. +24s local ≈ +2-3 min at the 5-7x CI multiplier;
    # 2026-07-24 (3): +14 interactive binding-resolution fixtures (track
    # 15-5: Label.text ×13 + hidden negation ×1, all waitFor+assert, no
    # screenshots) — local conf AVD full sweep 365s measured under
    # concurrent host load (a second emulator + an iOS sim; clean baseline
    # extrapolates to ~260-265s @664), so +14 ≈ +10-15s clean local
    # ≈ +1-2 min at the 5-7x CI multiplier;
    # 2026-07-25: +8 assertable variant-file fixtures (06 track: 3 run on
    # this lane, 5 skip by platforms) + 8 companion screens — local conf
    # AVD full sweep 356s measured under concurrent host load (web +
    # iOS lanes in parallel; comparable to the 365s@664 loaded reading
    # above), waitFor+text asserts only ≈ +5-10s clean local ≈ ≪1 min at
    # the 5-7x CI multiplier;
    # margin is dominated by the bad-runner multi-attempt case, not by
    # fixture count — see the budget arithmetic below)
    # varies WILDLY with the hosted runner drawn: ~7 min on a good runner
    # (401s, one attempt, run 28683440355) vs 6x slower on a bad one
    # (progress.jsonl: 330 outcomes after a full 20-min attempt, run
    # 28687476052) — same commit, same config. Budgets must fit the bad
    # runner: run_conformance's attempt loop RESUMES via on-device
    # progress.jsonl (chop-safe: a fixture chopped by the per-attempt
    # timeout re-runs once before counting as an error), so a slow runner
    # needs boot ~2 + gradle ~5 + several 20-min attempts.
    # The liveness probe (adb + screencap) fast-fails a truly wedged
    # emulator and the step is retried once FRESH.
    #
    # Budget sized from measurement, not from the healthy case. Emulator
    # throughput on hosted runners varies ~10x run to run: 1207 outcomes in
    # one 7-minute instrumentation attempt (2026-07-26, job green in 13 min)
    # versus ~325 per 20-minute attempt on a degraded runner — the same suite
    # needs ~85-95 min there, which the old 70-minute steps could not hold.
    # Two of three runs on 2026-07-29 died on that ceiling.
    #
    # 2026-08-07 (plan 51-H) re-measure — the Wave 3 fixture expansion:
    #   android-eligible fixtures 672 → 853 (+27%; manifest total 1031).
    #   The degraded-runner case is the one that sizes this, and it scales
    #   with fixture count: 87 min at 672 (4 resumed attempts at the
    #   measured worst rate of ~325 outcomes per 20-min attempt, plus boot
    #   ~2 + gradle ~5) → 87 × 853/672 ≈ 110 min at 853. Cross-check from
    #   the outcome side, since outcomes ≈ 1.8 × fixtures (1207 measured
    #   at 672): 853 × 1.8 ≈ 1532 outcomes → ceil(1532/325) = 5 attempts
    #   → 5 × 20 + 7 = 107 min. Two independent derivations, 107 vs 110.
    #   The OLD retry step of 100 no longer holds either number, which is
    #   the whole failure mode this budget exists to prevent (a cancelled
    #   job reads as a red suite, and "cancelled" means suspect the
    #   timeout first).
    #   Good-runner readings for scale, same workflow: android 20 min and
    #   android-codegen 18 min in run 31135850340 (green, 2026-08-07) —
    #   the budget is sized for the bad runner, not these.
    #
    # attempt < step < job:
    #   per-attempt cap 20 min (run_conformance.sh), resumed on timeout
    #   step 95 + retry 130 + setup ~15 + upload ≈ 245 → job 270
    #   (retry 130 holds the 110-min degraded case with ~18% margin, the
    #   same margin ratio the old 100-vs-87 pair carried)
    # Weekly on a public repo — runner minutes are free; wall-clock only
    # gates the weekly report.
    timeout-minutes: 270
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
    outputs:
      library_sha: ${{ steps.library_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: main
          path: KotlinJsonUI
      - name: Record the KotlinJsonUI commit these pixels were drawn by
        id: library_sha
        run: echo "sha=$(git -C KotlinJsonUI rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Attempt 1: continue-on-error so a wedge (now fast-failed by the script,
      # ~2 min via the liveness gate, not a full-step hang) doesn't fail the job —
      # the retry below runs on a FRESH emulator, which is the only way to
      # recover a frozen one. 70-min step timeout is a backstop.
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/results/android.results.json conformance/results/android.logcat*.txt
      - name: Run Android conformance suite (emulator)
        id: android_emu
        continue-on-error: true
        timeout-minutes: 95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          # Pinpoint boot cutoff: a healthy emulator boots in ~1-2 min, so a
          # 5-min boot-timeout fast-fails a boot-phase wedge (the action kills
          # the emulator and the step fails) — the fresh-emulator retry then
          # recovers, instead of a boot hang riding the whole step timeout.
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            KotlinJsonUI/conformance-host/scripts/collect_results.sh
      # Retry once with a fresh emulator only if attempt 1 failed. This step is
      # NOT continue-on-error, so a second failure correctly fails the job.
      - name: Retry Android conformance suite (fresh emulator)
        if: steps.android_emu.outcome == 'failure'
        # Wider than attempt 1: this is the one that has to absorb a degraded
        # runner, where the suite needs ~85-95 min rather than ~10.
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          # Pinpoint boot cutoff: a healthy emulator boots in ~1-2 min, so a
          # 5-min boot-timeout fast-fails a boot-phase wedge (the action kills
          # the emulator and the step fails) — the fresh-emulator retry then
          # recovers, instead of a boot hang riding the whole step timeout.
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          if-no-files-found: error
          path: |
            conformance/results/android.results.json
            conformance/results/android.logcat*.txt
            conformance/artifacts/android/

  # ------------------------------------------------------------------ #
  # Android codegen — the SAME fixtures through the kjui-GENERATED
  # Compose views (production pipeline); screenshots feed `gate --parity`
  # against the dynamic baselines (plan 25 B). Same emulator budget
  # arithmetic as the dynamic job.
  # ------------------------------------------------------------------ #
  android-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      KJUI_TOOLS_PATH: ${{ github.workspace }}/kjui_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: main
          path: KotlinJsonUI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1 # kjui build inside generate_codegen_host.rb
        with:
          ruby-version: "3.3"
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/codegen/android.results.json
      - name: Generate the codegen fixture registry (kjui build)
        run: ruby KotlinJsonUI/conformance-host/scripts/generate_codegen_host.rb
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android codegen suite (emulator)
        id: android_codegen_emu
        continue-on-error: true
        timeout-minutes: 95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Retry Android codegen suite (fresh emulator)
        if: steps.android_codegen_emu.outcome == 'failure'
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android-codegen
          if-no-files-found: error
          path: |
            conformance/codegen/android.results.json
            conformance/artifacts/android-codegen/

  # ------------------------------------------------------------------ #
  # Merge all three fresh results into REPORT.md and gate on:
  # 0 cross-platform mismatches / 0 fail / 0 error / no stale results /
  # screenshots actually compared / no visual or attribute-effect
  # regressions / missing_artifact & no_baseline within their ratchet
  # ceilings (conformance/gate_ratchet.json).
  # ------------------------------------------------------------------ #
  report:
    runs-on: ubuntu-latest
    # 2026-08-07 (plan 51-H) re-measure. This was the TIGHTEST budget in the
    # file and nobody had noticed, because it is also the shortest: 8 min
    # used of 10 in run 31135850340 (green) and 6 of 10 in 31088841656 —
    # 80% and 60%. Every other job sat under 50%.
    #
    # It scales with fixture count twice over: the baseline compare dHashes
    # every PNG of all five artifact sets, and the control diff pixel-diffs
    # each fixture against its control. The Wave 3 expansion takes the
    # manifest 915 → 1031 (+13%), which lands the measured 8 min at ~9 —
    # inside 10 only until the next fixture lands, and a gate job that gets
    # cut off reads as a red suite rather than as a budget problem
    # ("cancelled" means suspect the timeout first).
    #
    # 20 restores roughly the 2x headroom the other jobs carry. Cheap: this
    # is a weekly public-repo run, so wall-clock only gates the report.
    timeout-minutes: 20
    needs: [web, ios, android, ios-codegen, android-codegen]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        # [conformance] pulls in Pillow. Without it every screenshot
        # comparison is skipped and the gate below reports 0 regressions for
        # a check that never ran — which is exactly how an iOS runner upgrade
        # re-rendered all 490 fixtures unnoticed.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[conformance]'
      - name: Download platform results
        # merge-multiple lands results/<p>.results.json + artifacts/<p>/ from
        # all three jobs under conformance/, replacing the committed baseline.
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: conformance
          merge-multiple: true
      - name: Render report + gate (jui conformance gate)
        # The full judgment: all three platforms selected, visual checks on.
        # Cross-platform mismatch is judged because every result here is
        # fresh from this run; the attribute-effect check is the only gate
        # that notices an attribute going inert (a dropped attribute renders
        # the default and matches the default baseline it recorded last
        # time); the ratchets stop fixtures from quietly exiting visual
        # coverage. Same command runs locally; logic + tests live in
        # jui_tools/jui_cli/conformance/gate.py + tests/test_conformance_gate.py.
        #
        # --env ci: visual facts are per-renderer, so this lane compares only
        # against baselines/ci/ (baked from CI artifacts) and uses the ci
        # ratchet ceilings — never the developer-machine bakes under
        # baselines/local/ (a locally-baked baseline vs a CI render mismatched
        # 534/506 screenshots wholesale on 2026-08-01; that comparison
        # measures the environment, not a regression). The attribute-effect
        # ledger is asserted from local renders, so under this env an inert
        # entry is a notice, not a failure (plan 25 Phase 0).
        # --parity: the codegen jobs' screenshots must match the dynamic
        # baselines within the calibrated thresholds, with every deviation
        # recorded + justified in codegen_parity.json (plan 25 A/B).
        # --cross-effect: cross-platform activeness agreement + semantics-
        # contract expectations (plan 33). Enforced under env local; under
        # this lane's env=ci findings are NOTICES by design — same
        # env-scoping as the attribute-effect ledger above.
        # --inert-complete: every fixture that renders identically to its
        # control is accounted for — by a ledger, by the contract, or by an
        # entry in inert_audit.json (plan 34 Phase 3). This is the check that
        # sees an attribute SILENTLY dropping out: the other lanes all ask
        # "is this specific recorded thing still true", and a newly-inert
        # fixture nobody has an opinion about answers none of them. Same
        # env-scoping again — asserted local, notice here.
        # --rendered-by: which library drew this run's pixels. A baseline
        # records the same, so when a regression is measured against one
        # drawn by a different library, the gate says so — a notice, not a
        # failure. Thirteen regressions in one run were neither fixture nor
        # codegen and two lanes reached "the library moved" by elimination.
        run: python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(['conformance','gate','--platform','ios','--platform','android','--platform','web','--env','ci','--parity','--cross-effect','--inert-complete','--value-discrimination','--rendered-by','swiftjsonui=${{ needs.ios.outputs.library_sha }}','--rendered-by','kotlinjsonui=${{ needs.android.outputs.library_sha }}']))"
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          if-no-files-found: error
          path: |
            conformance/REPORT.md
            conformance/results/
            conformance/artifacts/
