name: conformance-mobile

# Full 3-platform conformance run (iOS + Android + Web) with the combined
# cross-platform report as the gate: 0 mismatches / 0 fail / 0 error.
#
# Too slow for per-push (iOS ~30 min on a macOS runner, Android needs an
# emulator boot), so it runs nightly + on manual dispatch. Per-push coverage
# is ci.yml (unit suites + guards + web conformance).
#
# The iOS host lives in the SwiftJsonUI repo (ConformanceHost/), the Android
# host in the KotlinJsonUI repo (conformance-host/) — both public and checked
# out read-only alongside this repo. The iOS UITest driver is vendored at
# sync time from the public jsonui-test-runner repo; the Android host commits
# its vendored driver.

on:
  schedule:
    # 18:00 UTC = 03:00 JST — after the workday, before the next one.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: conformance-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Web — rerun (not reuse a stale artifact) so all three results in the
  # report come from the same commit's fixtures. Same steps as ci.yml's
  # web-conformance job minus the per-platform gate (the report job gates).
  # ------------------------------------------------------------------ #
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # scripts/run.ts relies on native TS type stripping (Node >= 23)
          cache: npm
          cache-dependency-path: conformance/hosts/web/package-lock.json
      - uses: ruby/setup-ruby@v1 # rjui_tools codegen inside generate.sh
        with:
          ruby-version: "3.3"
      - name: npm ci
        working-directory: conformance/hosts/web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: conformance/hosts/web
        run: npx playwright install --with-deps chromium
      - name: Generate fixtures into the host (rjui codegen)
        working-directory: conformance/hosts/web
        run: ./generate.sh
      - name: Run web conformance suite
        working-directory: conformance/hosts/web
        run: npm run conformance
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          if-no-files-found: error
          path: |
            conformance/results/web.results.json
            conformance/artifacts/web/

  # ------------------------------------------------------------------ #
  # iOS — SwiftJsonUI Dynamic mode host, headless xcodebuild test on a
  # simulator. Xcode is pinned so the simulator runtime is deterministic.
  # ------------------------------------------------------------------ #
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      JSONUI_TEST_RUNNER_PATH: ${{ github.workspace }}/jsonui-test-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/SwiftJsonUI
          ref: master
          path: SwiftJsonUI
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/jsonui-test-runner
          path: jsonui-test-runner
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"
      - uses: ruby/setup-ruby@v1 # generate_project.rb needs the xcodeproj gem
        with:
          ruby-version: "3.3"
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Sync fixtures + vendor the iOS test-runner driver
        run: SwiftJsonUI/ConformanceHost/scripts/sync_fixtures.sh
      - name: Generate ConformanceHost.xcodeproj
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_project.rb
      - name: Run iOS conformance suite (headless simulator)
        env:
          SIMULATOR_NAME: iPhone 16 Pro
        run: SwiftJsonUI/ConformanceHost/scripts/run_conformance.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          if-no-files-found: error
          path: |
            conformance/results/ios.results.json
            conformance/artifacts/ios/

  # ------------------------------------------------------------------ #
  # Android — KotlinJsonUI Compose dynamic host on a headless emulator
  # (KVM-accelerated on ubuntu-latest). Tablet profile matches the
  # committed baseline runs (small phones can push fixtures offscreen).
  # ------------------------------------------------------------------ #
  android:
    runs-on: ubuntu-latest
    # Green baseline is ~11 min suite + ~5 min boot/gradle. 40 min job timeout
    # backstops an emulator wedge (observed: the `am instrument` step can hang
    # for the full window after a clean BUILD SUCCESSFUL — infra, not a fixture
    # deadlock, since the committed android.hashes.json proves the suite goes
    # green). The step-level timeout below is the primary fast-fail.
    timeout-minutes: 40
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: main
          path: KotlinJsonUI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android conformance suite (emulator)
        # Boot + gradle build/install + 11-min green suite ≈ 20 min; 28 min
        # fast-fails an emulator wedge (the instrumentation hanging with no
        # per-fixture output) instead of letting it ride the job timeout.
        timeout-minutes: 28
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          if-no-files-found: error
          path: |
            conformance/results/android.results.json
            conformance/artifacts/android/

  # ------------------------------------------------------------------ #
  # Merge all three fresh results into REPORT.md and gate on:
  # 0 cross-platform mismatches / 0 fail / 0 error / no stale results.
  # ------------------------------------------------------------------ #
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [web, ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Download platform results
        # merge-multiple lands results/<p>.results.json + artifacts/<p>/ from
        # all three jobs under conformance/, replacing the committed baseline.
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: conformance
          merge-multiple: true
      - name: Render report + gate (0 mismatch / 0 fail / 0 error / not stale)
        run: |
          python3 - <<'EOF'
          import json, sys
          from collections import Counter
          from pathlib import Path
          from jui_cli.conformance.report import generate_report

          summary = generate_report(Path("conformance"))
          print(f"report written to {summary.out_path}")
          problems = []

          expected = {"android", "ios", "web"}
          missing = expected - set(summary.platforms)
          if missing:
              problems.append(f"missing platform results: {', '.join(sorted(missing))}")
          if summary.mismatch_count:
              problems.append(f"{summary.mismatch_count} cross-platform mismatch(es) — see REPORT.md")
          if summary.stale_platforms:
              problems.append(f"stale results (manifestHash != committed manifest): {', '.join(summary.stale_platforms)}")
          for platform, ids in summary.unknown_ids.items():
              problems.append(f"{platform}: {len(ids)} fixture id(s) not in manifest")

          for platform in sorted(expected - missing):
              data = json.loads(Path(f"conformance/results/{platform}.results.json").read_text())
              tally = Counter(r["status"] for r in data["results"])
              print(f"{platform}: {dict(tally)}")
              bad = [r for r in data["results"] if r["status"] in ("fail", "error")]
              for r in bad[:30]:
                  print(f"  {r['status']:5} {r['id']} — {r.get('detail', '')}")
              if bad:
                  problems.append(f"{platform}: {len(bad)} fail/error result(s)")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print("conformance gate: OK (0 mismatch / 0 fail / 0 error)")
          EOF
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          if-no-files-found: error
          path: |
            conformance/REPORT.md
            conformance/results/
            conformance/artifacts/
