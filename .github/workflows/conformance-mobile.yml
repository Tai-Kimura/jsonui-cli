name: conformance-mobile

# Full 3-platform conformance run (iOS + Android + Web) with the combined
# cross-platform report as the gate: 0 mismatches / 0 fail / 0 error.
#
# Too slow for per-push (iOS ~30 min on a macOS runner, Android needs an
# emulator boot), so it runs weekly + on manual dispatch. Per-push coverage
# is ci.yml (unit suites + guards + web conformance). For an on-demand full
# run (e.g. before a release), use workflow_dispatch.
#
# The iOS host lives in the SwiftJsonUI repo (ConformanceHost/), the Android
# host in the KotlinJsonUI repo (conformance-host/) — both public and checked
# out read-only alongside this repo. The iOS UITest driver is vendored at
# sync time from the public jsonui-test-runner repo; the Android host commits
# its vendored driver.

on:
  schedule:
    # Sunday 18:00 UTC = Monday 03:00 JST — weekly, results ready before the
    # work week starts.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    # Before a SwiftJsonUI / KotlinJsonUI tag: dispatch with the release
    # branches, see the jobs green (TapIdentifierOnceUITests is not opt-in — it
    # runs in both iOS jobs), then tag. The schedule has no inputs, so it keeps
    # `master` / `main`.
    inputs:
      swiftjsonui_ref:
        description: "SwiftJsonUI ref (branch, tag or SHA) both iOS jobs check out"
        required: false
        default: master
        type: string
      image_probes:
        description: "Also run the opt-in image probes (DecorativeImageProbe, ImageEventsProbe) in both iOS jobs"
        required: false
        default: false
        type: boolean
      kotlinjsonui_ref:
        description: "KotlinJsonUI ref (branch, tag or SHA) the three Android jobs check out"
        required: false
        default: main
        type: string
      android_probes:
        description: "Also run the opt-in probes in KotlinJsonUI's device tests (every instrumentation argument a test compares to \"1\")"
        required: false
        default: false
        type: boolean

concurrency:
  group: conformance-mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  # Web — rerun (not reuse a stale artifact) so all three results in the
  # report come from the same commit's fixtures. Same steps as ci.yml's
  # web-conformance job minus the per-platform gate (the report job gates).
  # ------------------------------------------------------------------ #
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      library_sha: ${{ steps.library_sha.outputs.sha }}
      chromium: ${{ steps.library_sha.outputs.chromium }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # scripts/run.ts relies on native TS type stripping (Node >= 23)
          cache: npm
          cache-dependency-path: conformance/hosts/web/package-lock.json
      - uses: ruby/setup-ruby@v1 # rjui_tools codegen inside generate.sh
        with:
          ruby-version: "3.3"
      - name: Drop the checked-out results file
        # Every results file in this repo is TRACKED, so a checkout puts a
        # PREVIOUS campaign's results on disk before this job measures
        # anything. When a run dies before its collect step, the upload below
        # still finds that file, `if-no-files-found: error` is satisfied, and
        # the artifact reads as a successful suite — mobile run 30912810635
        # shipped plan 32's "pass: 478" as though android-codegen had run,
        # while the lane had produced zero screenshots. Delete it first so the
        # artifact can only ever contain THIS run's product.
        run: rm -f conformance/results/web.results.json
      - name: npm ci
        working-directory: conformance/hosts/web
        run: npm ci
      # 🔻 `--with-deps` runs `apt-get update`, and apt fails the update
      # WHOLESALE when any single configured source has an inconsistent index.
      # The runner image ships Google's chrome repo, and this job does not use
      # one package from it.
      #
      # Measured 2026-09-10 from outside CI, reproducing the failure by hand:
      #   Release (Date 2026-09-09 17:16:59 UTC) declares
      #     main/binary-amd64/Packages.gz  sha256 233e56de…  1405 B
      #   the file actually served was
      #     sha256 bc1428ab…  1405 B
      #   and gunzipping it gave an index whose google-chrome-beta is
      #   154.0.8037.0-1 while the plain (matching) Packages says
      #   154.0.8037.17-1 — the .gz on the CDN is one release behind its own
      #   Release file. Three consecutive runs died here before a single test
      #   executed.
      #
      # That repository carries exactly five packages, all `google-chrome-*`
      # (read off the index itself), and Playwright downloads Chromium from
      # its own CDN. So nothing this job needs can come from it.
      #
      # 🚫 THIS DOES NOT SOFTEN THE GATE. The browser install must still
      # succeed and every remaining source must still be consistent; `apt-get
      # update` is not made non-fatal, and no `|| true` is added. What changes
      # is that an unrelated third party can no longer decide whether this job
      # runs. Removing the source is narrower than ignoring update failures,
      # which would also hide a broken Ubuntu mirror.
      - name: Drop the unused Chrome apt source
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
      - name: Install Playwright Chromium
        working-directory: conformance/hosts/web
        run: npx playwright install --with-deps chromium
      - name: Record the web renderer these pixels were drawn by
        id: library_sha
        # web had no provenance at all — ci/web.hashes.json carried an empty
        # rendered_by, so "did the renderer move since the bake" could not be
        # answered for this platform even in principle. Two things draw here:
        # the rjui codegen in this repo, and the browser.
        run: |
          rjui=$(git rev-parse HEAD:rjui_tools/lib)
          chromium=$(npx --yes playwright --version 2>/dev/null | tr -d '\n' || echo unknown)
          echo "sha=tree:$rjui" >> "$GITHUB_OUTPUT"
          echo "chromium=$chromium" >> "$GITHUB_OUTPUT"
      - name: Generate fixtures into the host (rjui codegen)
        working-directory: conformance/hosts/web
        run: ./generate.sh
      - name: Run web conformance suite
        working-directory: conformance/hosts/web
        run: npm run conformance
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-web
          if-no-files-found: error
          path: |
            conformance/results/web.results.json
            conformance/artifacts/web/

  # ------------------------------------------------------------------ #
  # iOS — SwiftJsonUI Dynamic mode host, headless xcodebuild test on a
  # simulator. Xcode is pinned so the simulator runtime is deterministic.
  # ------------------------------------------------------------------ #
  ios:
    runs-on: macos-15
    # 2026-08-07 (plan 51-H) re-measure — held, with the reading recorded so
    # the next resize starts from a number instead of re-deriving one.
    # Measured 41 min (run 31135850340, green) and 36 min (31088841656) of
    # 90. iOS-eligible fixtures go to 958 with the Wave 3 expansion (+13%
    # on the manifest), putting it near 47 — still ~1.9x headroom, and the
    # simulator has no degraded-runner attempt loop to absorb like Android's.
    timeout-minutes: 90
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      JSONUI_TEST_RUNNER_PATH: ${{ github.workspace }}/jsonui-test-runner
    outputs:
      library_sha: ${{ steps.library_sha.outputs.sha }}
      toolchain: ${{ steps.toolchain.outputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/SwiftJsonUI
          ref: ${{ inputs.swiftjsonui_ref || 'master' }}
          path: SwiftJsonUI
      - name: Record the SwiftJsonUI SOURCE these pixels were drawn by
        id: library_sha
        # The tree hash of Sources/, not `rev-parse HEAD`. The checkout SHA
        # moves for commits that cannot change a pixel — on 2026-09-04 three
        # ConformanceHost-only commits would have reported "the library moved"
        # with Sources/ byte-identical, and a lane was one bake away from
        # investigating it. Identical drawing code gives an identical tree
        # hash whatever the history above it looks like.
        run: |
          echo "SwiftJsonUI ref=${{ inputs.swiftjsonui_ref || 'master' }} HEAD=$(git -C SwiftJsonUI rev-parse HEAD)"
          echo "sha=tree:$(git -C SwiftJsonUI rev-parse HEAD:Sources)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/jsonui-test-runner
          path: jsonui-test-runner
          # drivers/ios is a submodule since test-runner 61a860e — without this
          # the vendor step finds an empty gitlink and fails
          submodules: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - uses: ruby/setup-ruby@v1 # generate_project.rb needs the xcodeproj gem
        with:
          ruby-version: "3.3"
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Sync fixtures + vendor the iOS test-runner driver
        run: SwiftJsonUI/ConformanceHost/scripts/sync_fixtures.sh
      - name: Generate ConformanceHost.xcodeproj
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_project.rb
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/results/ios.results.json
      # The baseline records who drew the pixels. Until now that was the
      # library SHA only — the subject. The tools that decide what the
      # picture looks like (Xcode, the SDK, the simulator runtime, the
      # device model) were recorded nowhere, so a `moved` entry could not
      # be attributed: a token change in a new Xcode moves pictures that
      # use none of the changed features, and from the baseline alone that
      # is indistinguishable from a library regression. The web leg has
      # recorded its renderer (chromium) since it was written; iOS and
      # Android had the subject and not the tools.
      - name: Record the toolchain that drew these pixels
        id: toolchain
        env:
          SIMULATOR_NAME: iPhone 16 Pro
          # Pinned, not "whatever is newest" — see run_conformance.sh.
          SIMULATOR_OS: "26"
        run: |
          set -euo pipefail
          xcode=$(xcodebuild -version | head -1 | cut -d' ' -f2)
          build=$(xcodebuild -version | tail -1 | cut -d' ' -f3)
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          # ⚠️ APPLIES THE SAME PIN THE RUN WILL APPLY. This took rs[-1] — the
          # newest INSTALLED iOS runtime — while the suite picked its own. When
          # the two disagree the manifest records a runtime that drew nothing:
          # a measurement-shaped value that cannot be checked against anything.
          runtime=$(xcrun simctl list runtimes --json \
            | python3 -c 'import json,os,re,sys; w=tuple(int(n) for n in re.findall(r"\d+", os.environ.get("SIMULATOR_OS",""))); rs=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and "iOS" in r.get("name","")]; rs=[r for r in rs if not w or tuple(int(n) for n in re.findall(r"\d+", r["version"]))[:len(w)]==w]; print(rs[-1]["version"] if rs else "unknown")')
          if [ "$runtime" = "unknown" ]; then
            echo "::error::no available iOS runtime matches SIMULATOR_OS=${SIMULATOR_OS:-<unset>}" >&2
            xcrun simctl list runtimes >&2 || true
            exit 1
          fi
          echo "spec=xcode=${xcode} (${build});sdk=iphonesimulator${sdk};simulator_os=iOS ${runtime};device=${SIMULATOR_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run iOS conformance suite (headless simulator)
        env:
          SIMULATOR_NAME: iPhone 16 Pro
          # Pinned, not "whatever is newest" — see run_conformance.sh.
          SIMULATOR_OS: "26"
          # The opt-in probes read these through the test runner (TEST_RUNNER_
          # prefix stripped); "0" when not dispatched with image_probes.
          TEST_RUNNER_DECORATIVE_IMAGE_PROBE: ${{ inputs.image_probes && '1' || '0' }}
          TEST_RUNNER_IMAGE_EVENTS_PROBE: ${{ inputs.image_probes && '1' || '0' }}
        run: SwiftJsonUI/ConformanceHost/scripts/run_conformance.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios
          if-no-files-found: error
          path: |
            conformance/results/ios.results.json
            conformance/artifacts/ios/

  # ------------------------------------------------------------------ #
  # iOS codegen — the SAME fixtures through the sjui-GENERATED SwiftUI
  # views (production pipeline). Screenshots feed `gate --parity`, which
  # compares them against the dynamic baselines: dynamic ≡ codegen as a
  # judged invariant instead of maintainer working memory (plan 25 A).
  # ------------------------------------------------------------------ #
  ios-codegen:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      JSONUI_TEST_RUNNER_PATH: ${{ github.workspace }}/jsonui-test-runner
      SJUI_TOOLS_PATH: ${{ github.workspace }}/sjui_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/SwiftJsonUI
          ref: ${{ inputs.swiftjsonui_ref || 'master' }}
          path: SwiftJsonUI
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/jsonui-test-runner
          path: jsonui-test-runner
          submodules: true
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install xcodeproj gem
        run: gem install xcodeproj --no-document
      - name: Sync fixtures + vendor the iOS test-runner driver
        run: SwiftJsonUI/ConformanceHost/scripts/sync_fixtures.sh
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/codegen/ios.results.json
      - name: Generate the codegen fixture registry (sjui build)
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_codegen_host.rb
      - name: Generate ConformanceHost.xcodeproj (codegen sources)
        run: ruby SwiftJsonUI/ConformanceHost/scripts/generate_project.rb
      - name: Run iOS codegen suite (headless simulator)
        env:
          SIMULATOR_NAME: iPhone 16 Pro
          # Pinned, not "whatever is newest" — see run_conformance.sh.
          SIMULATOR_OS: "26"
          HOST_MODE: codegen
          TEST_RUNNER_DECORATIVE_IMAGE_PROBE: ${{ inputs.image_probes && '1' || '0' }}
          TEST_RUNNER_IMAGE_EVENTS_PROBE: ${{ inputs.image_probes && '1' || '0' }}
        run: |
          echo "SwiftJsonUI ref=${{ inputs.swiftjsonui_ref || 'master' }} HEAD=$(git -C SwiftJsonUI rev-parse HEAD)"
          SwiftJsonUI/ConformanceHost/scripts/run_conformance.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-ios-codegen
          if-no-files-found: error
          path: |
            conformance/codegen/ios.results.json
            conformance/artifacts/ios-codegen/

  # ------------------------------------------------------------------ #
  # Android — KotlinJsonUI Compose dynamic host on a headless emulator
  # (KVM-accelerated on ubuntu-latest). Tablet profile matches the
  # committed baseline runs (small phones can push fixtures offscreen).
  # ------------------------------------------------------------------ #
  android:
    runs-on: ubuntu-latest
    # Suite duration (full 672-fixture set incl. interactive + screenshots;
    # 2026-07-24: +4 assertable Embed fixtures + 2 companion layouts — local
    # conf AVD assertable pass stayed ~58s/attempt, so +4 text-assert
    # fixtures ≈ +5-10s local → ≪1 min even at the 5-7x CI multiplier;
    # 2026-07-24 (2): +2 interactive tap-driven Embed fixtures (isolated
    # push/pop) + 1 companion — local conf AVD full sweep 250s vs 226s at
    # 643 fixtures, i.e. +24s local ≈ +2-3 min at the 5-7x CI multiplier;
    # 2026-07-24 (3): +14 interactive binding-resolution fixtures (track
    # 15-5: Label.text ×13 + hidden negation ×1, all waitFor+assert, no
    # screenshots) — local conf AVD full sweep 365s measured under
    # concurrent host load (a second emulator + an iOS sim; clean baseline
    # extrapolates to ~260-265s @664), so +14 ≈ +10-15s clean local
    # ≈ +1-2 min at the 5-7x CI multiplier;
    # 2026-07-25: +8 assertable variant-file fixtures (06 track: 3 run on
    # this lane, 5 skip by platforms) + 8 companion screens — local conf
    # AVD full sweep 356s measured under concurrent host load (web +
    # iOS lanes in parallel; comparable to the 365s@664 loaded reading
    # above), waitFor+text asserts only ≈ +5-10s clean local ≈ ≪1 min at
    # the 5-7x CI multiplier;
    # margin is dominated by the bad-runner multi-attempt case, not by
    # fixture count — see the budget arithmetic below)
    # varies WILDLY with the hosted runner drawn: ~7 min on a good runner
    # (401s, one attempt, run 28683440355) vs 6x slower on a bad one
    # (progress.jsonl: 330 outcomes after a full 20-min attempt, run
    # 28687476052) — same commit, same config. Budgets must fit the bad
    # runner: run_conformance's attempt loop RESUMES via on-device
    # progress.jsonl (chop-safe: a fixture chopped by the per-attempt
    # timeout re-runs once before counting as an error), so a slow runner
    # needs boot ~2 + gradle ~5 + several 20-min attempts.
    # The liveness probe (adb + screencap) fast-fails a truly wedged
    # emulator and the step is retried once FRESH.
    #
    # Budget sized from measurement, not from the healthy case. Emulator
    # throughput on hosted runners varies ~10x run to run: 1207 outcomes in
    # one 7-minute instrumentation attempt (2026-07-26, job green in 13 min)
    # versus ~325 per 20-minute attempt on a degraded runner — the same suite
    # needs ~85-95 min there, which the old 70-minute steps could not hold.
    # Two of three runs on 2026-07-29 died on that ceiling.
    #
    # 2026-08-07 (plan 51-H) re-measure — the Wave 3 fixture expansion:
    #   android-eligible fixtures 672 → 853 (+27%; manifest total 1031).
    #   The degraded-runner case is the one that sizes this, and it scales
    #   with fixture count: 87 min at 672 (4 resumed attempts at the
    #   measured worst rate of ~325 outcomes per 20-min attempt, plus boot
    #   ~2 + gradle ~5) → 87 × 853/672 ≈ 110 min at 853. Cross-check from
    #   the outcome side, since outcomes ≈ 1.8 × fixtures (1207 measured
    #   at 672): 853 × 1.8 ≈ 1532 outcomes → ceil(1532/325) = 5 attempts
    #   → 5 × 20 + 7 = 107 min. Two independent derivations, 107 vs 110.
    #   The OLD retry step of 100 no longer holds either number, which is
    #   the whole failure mode this budget exists to prevent (a cancelled
    #   job reads as a red suite, and "cancelled" means suspect the
    #   timeout first).
    #   Good-runner readings for scale, same workflow: android 20 min and
    #   android-codegen 18 min in run 31135850340 (green, 2026-08-07) —
    #   the budget is sized for the bad runner, not these.
    #
    # attempt < step < job:
    #   per-attempt cap 20 min (run_conformance.sh), resumed on timeout
    #   step 95 + retry 130 + setup ~15 + upload ≈ 245 → job 270
    #   (retry 130 holds the 110-min degraded case with ~18% margin, the
    #   same margin ratio the old 100-vs-87 pair carried)
    # Weekly on a public repo — runner minutes are free; wall-clock only
    # gates the weekly report.
    timeout-minutes: 270
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
    outputs:
      library_sha: ${{ steps.library_sha.outputs.sha }}
      toolchain: ${{ steps.android_toolchain.outputs.spec }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: ${{ inputs.kotlinjsonui_ref || 'main' }}
          path: KotlinJsonUI
      - name: Record the KotlinJsonUI SOURCE these pixels were drawn by
        id: library_sha
        # Both published modules draw: `library` (codegen) and
        # `library-dynamic`. See the ios note for why this is a tree hash.
        run: |
          echo "KotlinJsonUI ref=${{ inputs.kotlinjsonui_ref || 'main' }} HEAD=$(git -C KotlinJsonUI rev-parse HEAD)"
          lib=$(git -C KotlinJsonUI rev-parse HEAD:library/src)
          dyn=$(git -C KotlinJsonUI rev-parse HEAD:library-dynamic/src)
          echo "sha=tree:$lib+$dyn" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Attempt 1: continue-on-error so a wedge (now fast-failed by the script,
      # ~2 min via the liveness gate, not a full-step hang) doesn't fail the job —
      # the retry below runs on a FRESH emulator, which is the only way to
      # recover a frozen one. 70-min step timeout is a backstop.
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/results/android.results.json conformance/results/android.logcat*.txt
      # Same reason as the iOS leg: the baseline recorded the subject
      # (library SHA) and none of the tools. An AGP / emulator image /
      # API level change moves pictures that use none of the changed
      # features. `api_level` is read from this workflow's own value so the
      # record cannot drift from what actually booted.
      - name: Record the toolchain that drew these pixels
        id: android_toolchain
        run: |
          set -euo pipefail
          # AGP has (at least) two spellings and this repo uses the one the
          # first predicate could not see: the plugin DSL
          #   id("com.android.library") version "9.2.0"
          # not the buildscript classpath `com.android.tools.build:gradle:X`.
          # Every ci baseline baked before 2026-09-15 therefore records
          # `agp=unknown` — which reads as "looked, and there is no AGP"
          # rather than "our grep does not match this repo". A toolchain
          # coordinate the baseline exists to record was silently absent.
          # Both spellings are searched, and NOT FINDING ONE IS AN ERROR:
          # `unknown` is what a dead predicate returns, so it must not be a
          # value this step can quietly ship.
          # ⚠️ `|| true` ON EVERY SEARCH, BECAUSE `set -euo pipefail` IS ABOVE.
          # Without it the FIRST grep finding nothing kills the step: the
          # command substitution exits non-zero, `set -e` fires, and neither
          # the second spelling nor the "neither matched" error below is ever
          # reached. Measured 2026-09-15 (run 34933040350): this step exited 2
          # with no output at all — the fallback and the diagnostic were both
          # written and both unreachable. A no-match is the NORMAL outcome for
          # whichever spelling this repo does not use, so it cannot be fatal.
          agp=$(grep -ohE 'com\.android\.tools\.build:gradle:[0-9.]+' \
                  KotlinJsonUI/build.gradle.kts KotlinJsonUI/*/build.gradle.kts 2>/dev/null \
                | head -1 | cut -d: -f3 || true)
          if [ -z "$agp" ]; then
            agp=$(grep -ohE 'id\("com\.android\.(library|application)"\) version "[0-9.]+"' \
                    KotlinJsonUI/build.gradle.kts KotlinJsonUI/*/build.gradle.kts 2>/dev/null \
                  | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi
          if [ -z "$agp" ]; then
            echo "error: neither AGP spelling matched. A third spelling exists, or the" >&2
            echo "       files moved. Recording 'unknown' would hide that." >&2
            exit 1
          fi
          gradle=$(grep -oE 'gradle-[0-9.]+-' KotlinJsonUI/gradle/wrapper/gradle-wrapper.properties \
                | head -1 | sed 's/gradle-//;s/-$//' || echo unknown)
          echo "spec=api_level=34;emulator_target=default;agp=${agp};gradle=${gradle}" >> "$GITHUB_OUTPUT"
      - name: Run Android conformance suite (emulator)
        id: android_emu
        continue-on-error: true
        timeout-minutes: 95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          # Pinpoint boot cutoff: a healthy emulator boots in ~1-2 min, so a
          # 5-min boot-timeout fast-fails a boot-phase wedge (the action kills
          # the emulator and the step fails) — the fresh-emulator retry then
          # recovers, instead of a boot hang riding the whole step timeout.
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            KotlinJsonUI/conformance-host/scripts/collect_results.sh
      # Retry once with a fresh emulator only if attempt 1 failed. This step is
      # NOT continue-on-error, so a second failure correctly fails the job.
      - name: Retry Android conformance suite (fresh emulator)
        if: steps.android_emu.outcome == 'failure'
        # Wider than attempt 1: this is the one that has to absorb a degraded
        # runner, where the suite needs ~85-95 min rather than ~10.
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          # Pinpoint boot cutoff: a healthy emulator boots in ~1-2 min, so a
          # 5-min boot-timeout fast-fails a boot-phase wedge (the action kills
          # the emulator and the step fails) — the fresh-emulator retry then
          # recovers, instead of a boot hang riding the whole step timeout.
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android
          if-no-files-found: error
          path: |
            conformance/results/android.results.json
            conformance/results/android.logcat*.txt
            conformance/artifacts/android/

  # ------------------------------------------------------------------ #
  # Android codegen — the SAME fixtures through the kjui-GENERATED
  # Compose views (production pipeline); screenshots feed `gate --parity`
  # against the dynamic baselines (plan 25 B). Same emulator budget
  # arithmetic as the dynamic job.
  # ------------------------------------------------------------------ #
  android-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      CONFORMANCE_DIR: ${{ github.workspace }}/conformance
      KJUI_TOOLS_PATH: ${{ github.workspace }}/kjui_tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: ${{ inputs.kotlinjsonui_ref || 'main' }}
          path: KotlinJsonUI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1 # kjui build inside generate_codegen_host.rb
        with:
          ruby-version: "3.3"
      - name: Drop the checked-out results file
        # See the web job: the results files are tracked, so a run that dies
        # before its collect step would otherwise upload a PREVIOUS
        # campaign's file and read as a successful suite.
        run: rm -f conformance/codegen/android.results.json
      - name: Generate the codegen fixture registry (kjui build)
        run: |
          echo "KotlinJsonUI ref=${{ inputs.kotlinjsonui_ref || 'main' }} HEAD=$(git -C KotlinJsonUI rev-parse HEAD)"
          ruby KotlinJsonUI/conformance-host/scripts/generate_codegen_host.rb
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android codegen suite (emulator)
        id: android_codegen_emu
        continue-on-error: true
        timeout-minutes: 95
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Retry Android codegen suite (fresh emulator)
        if: steps.android_codegen_emu.outcome == 'failure'
        timeout-minutes: 130
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/run_conformance.sh --fresh
            HOST_MODE=codegen KotlinJsonUI/conformance-host/scripts/collect_results.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android-codegen
          if-no-files-found: error
          path: |
            conformance/codegen/android.results.json
            conformance/artifacts/android-codegen/

  # ------------------------------------------------------------------ #
  # Android device tests — KotlinJsonUI's own instrumented tests
  # (library and library-dynamic, src/androidTest). No other job runs them:
  # KotlinJsonUI's ci.yml runs the JVM units, and the android job above runs
  # the conformance host's suite. Until 2026-09-26 an arm written there was
  # green on a developer's emulator and nowhere else. Judged from the results
  # XML (.github/scripts/kjui_device_tests.py), not from Gradle's exit alone:
  # a class with @Test and no case in the results is red.
  # Not in the report job's `needs`: the report judges pixels, and this job's
  # red already makes the run red.
  # ------------------------------------------------------------------ #
  android-library-tests:
    runs-on: ubuntu-latest
    # ⚠️ NOT YET MEASURED on a hosted runner. A guess to be replaced by the
    # first run's step time: gradle (two androidTest APKs) ~8 + boot ~2 +
    # tests ~10 on a good runner; the android job's degraded runner is ~6x
    # slower on the emulator part → ~80. Step 90, job 105 (attempt < step <
    # job). A cancelled run here means suspect this number first.
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tai-Kimura/KotlinJsonUI
          ref: ${{ inputs.kotlinjsonui_ref || 'main' }}
          path: KotlinJsonUI
      - name: Record the KotlinJsonUI SOURCE these tests ran against
        run: echo "KotlinJsonUI ref=${{ inputs.kotlinjsonui_ref || 'main' }} HEAD=$(git -C KotlinJsonUI rev-parse HEAD)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run KotlinJsonUI device tests (emulator)
        timeout-minutes: 90
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_PROBES: ${{ inputs.android_probes && 'true' || 'false' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash .github/scripts/kjui_device_tests.sh KotlinJsonUI
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-android-library-tests
          if-no-files-found: warn
          path: |
            KotlinJsonUI/library/build/outputs/androidTest-results/
            KotlinJsonUI/library-dynamic/build/outputs/androidTest-results/
            KotlinJsonUI/library/build/reports/androidTests/
            KotlinJsonUI/library-dynamic/build/reports/androidTests/

  # ------------------------------------------------------------------ #
  # Merge all three fresh results into REPORT.md and gate on:
  # 0 cross-platform mismatches / 0 fail / 0 error / no stale results /
  # screenshots actually compared / no visual or attribute-effect
  # regressions / missing_artifact & no_baseline within their ratchet
  # ceilings (conformance/gate_ratchet.json).
  # ------------------------------------------------------------------ #
  report:
    runs-on: ubuntu-latest
    # 2026-08-07 (plan 51-H) re-measure. This was the TIGHTEST budget in the
    # file and nobody had noticed, because it is also the shortest: 8 min
    # used of 10 in run 31135850340 (green) and 6 of 10 in 31088841656 —
    # 80% and 60%. Every other job sat under 50%.
    #
    # It scales with fixture count twice over: the baseline compare dHashes
    # every PNG of all five artifact sets, and the control diff pixel-diffs
    # each fixture against its control. The Wave 3 expansion takes the
    # manifest 915 → 1031 (+13%), which lands the measured 8 min at ~9 —
    # inside 10 only until the next fixture lands, and a gate job that gets
    # cut off reads as a red suite rather than as a budget problem
    # ("cancelled" means suspect the timeout first).
    #
    # 20 restores roughly the 2x headroom the other jobs carry. Cheap: this
    # is a weekly public-repo run, so wall-clock only gates the report.
    timeout-minutes: 20
    needs: [web, ios, android, ios-codegen, android-codegen]
    # 🔴 ALWAYS, BECAUSE ONE RED LEG USED TO DELETE THE WHOLE JUDGMENT.
    # Measured on run 34987243780: web/ios/ios-codegen/android all succeeded,
    # android-codegen failed on a real defect — and this job was SKIPPED, so
    # --parity, --cross-effect, --inert-complete, --value-discrimination, the
    # library drift notices, the visual regressions, the ink coverage and the
    # control diff were evaluated for NOTHING. Four legs left artifacts that
    # nobody judged, after about three hours of runner time.
    #
    # ⚠️ The tension is real and is NOT being collapsed the other way: a
    # COMPLETE report does need all five sets (it cross-checks them). What was
    # wrong was turning "cannot produce a complete report" into "produce
    # nothing". The verdict step below keeps the run RED whenever a face is
    # missing — an incomplete report is "not judged", never "passed".
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        # [conformance] pulls in Pillow. Without it every screenshot
        # comparison is skipped and the gate below reports 0 regressions for
        # a check that never ran — which is exactly how an iOS runner upgrade
        # re-rendered all 490 fixtures unnoticed.
        run: python -m pip install --upgrade pip && python -m pip install -e '.[conformance]'
      - name: Which faces can this run judge
        id: faces
        # 🔻 THE COVERAGE IS DERIVED FROM THE LEGS' OWN RESULTS, not assumed.
        # A leg that failed produced no trustworthy result set, so its face is
        # NOT JUDGED and says so by name. The codegen legs do not carry a
        # --platform of their own: they feed --parity for the face they mirror,
        # so a missing codegen leg removes parity for that face while leaving
        # its dynamic judgment intact.
        run: |
          set -euo pipefail
          judged=""; missing=""
          add() { [ "$2" = success ] && judged="$judged $1" || missing="$missing $1($2)"; }
          add web    "${{ needs.web.result }}"
          add ios    "${{ needs.ios.result }}"
          add android "${{ needs.android.result }}"
          cg_missing=""
          [ "${{ needs.ios-codegen.result }}" = success ] || cg_missing="$cg_missing ios-codegen(${{ needs.ios-codegen.result }})"
          [ "${{ needs.android-codegen.result }}" = success ] || cg_missing="$cg_missing android-codegen(${{ needs.android-codegen.result }})"
          all_missing="${missing}${cg_missing}"
          echo "judged=${judged# }" >> "$GITHUB_OUTPUT"
          echo "missing=${all_missing# }" >> "$GITHUB_OUTPUT"
          echo "== faces this run can judge: ${judged:-(none)}"
          echo "== NOT JUDGED: ${all_missing:-(none)}"
          echo "   (a face listed here was not measured. It is not a pass.)"
      - name: Download platform results
        # merge-multiple lands results/<p>.results.json + artifacts/<p>/ from
        # all three jobs under conformance/, replacing the committed baseline.
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: conformance
          merge-multiple: true
      - name: Render report + gate (jui conformance gate)
        # The full judgment: all three platforms selected, visual checks on.
        # Cross-platform mismatch is judged because every result here is
        # fresh from this run; the attribute-effect check is the only gate
        # that notices an attribute going inert (a dropped attribute renders
        # the default and matches the default baseline it recorded last
        # time); the ratchets stop fixtures from quietly exiting visual
        # coverage. Same command runs locally; logic + tests live in
        # jui_tools/jui_cli/conformance/gate.py + tests/test_conformance_gate.py.
        #
        # --env ci: visual facts are per-renderer, so this lane compares only
        # against baselines/ci/ (baked from CI artifacts) and uses the ci
        # ratchet ceilings — never the developer-machine bakes under
        # baselines/local/ (a locally-baked baseline vs a CI render mismatched
        # 534/506 screenshots wholesale on 2026-08-01; that comparison
        # measures the environment, not a regression). The attribute-effect
        # ledger is asserted from local renders, so under this env an inert
        # entry is a notice, not a failure (plan 25 Phase 0).
        # --parity: the codegen jobs' screenshots must match the dynamic
        # baselines within the calibrated thresholds, with every deviation
        # recorded + justified in codegen_parity.json (plan 25 A/B).
        # --cross-effect: cross-platform activeness agreement + semantics-
        # contract expectations (plan 33). Enforced under env local; under
        # this lane's env=ci findings are NOTICES by design — same
        # env-scoping as the attribute-effect ledger above.
        # --inert-complete: every fixture that renders identically to its
        # control is accounted for — by a ledger, by the contract, or by an
        # entry in inert_audit.json (plan 34 Phase 3). This is the check that
        # sees an attribute SILENTLY dropping out: the other lanes all ask
        # "is this specific recorded thing still true", and a newly-inert
        # fixture nobody has an opinion about answers none of them. Same
        # env-scoping again — asserted local, notice here.
        # --rendered-by: which library drew this run's pixels. A baseline
        # records the same, so when a regression is measured against one
        # drawn by a different library, the gate says so — a notice, not a
        # failure. Thirteen regressions in one run were neither fixture nor
        # codegen and two lanes reached "the library moved" by elimination.
        #
        # 🔻 ONLY THE FACES THIS RUN ACTUALLY MEASURED are passed. A failed leg
        # has no trustworthy results, and asking the gate to judge them would
        # report the committed baseline's leftovers as this run's answer.
        # `--rendered-by` follows the same rule: a failed leg's job output is
        # empty, and an empty coordinate compared against a baked one is a
        # drift notice about nothing.
        if: steps.faces.outputs.judged != ''
        run: |
          set -euo pipefail
          args=(conformance gate --env ci --parity --cross-effect --inert-complete --value-discrimination)
          for p in ${{ steps.faces.outputs.judged }}; do args+=(--platform "$p"); done
          [ "${{ needs.ios.result }}" = success ] && args+=(--rendered-by "swiftjsonui.src=${{ needs.ios.outputs.library_sha }}" --rendered-by "ios.toolchain=${{ needs.ios.outputs.toolchain }}")
          [ "${{ needs.android.result }}" = success ] && args+=(--rendered-by "kotlinjsonui.src=${{ needs.android.outputs.library_sha }}" --rendered-by "android.toolchain=${{ needs.android.outputs.toolchain }}")
          [ "${{ needs.web.result }}" = success ] && args+=(--rendered-by "rjui.src=${{ needs.web.outputs.library_sha }}" --rendered-by "chromium=${{ needs.web.outputs.chromium }}")
          printf 'gate args:'; printf ' %s' "${args[@]}"; printf '\n'
          python3 -c "import sys; from jui_cli.cli import main; sys.exit(main(sys.argv[1:]))" "${args[@]}"
      - name: Verdict — an incomplete run is NOT a pass
        # 🔴 THE STEP THAT STOPS "4/5 GREEN" FROM EXISTING. The gate above now
        # judges whatever was measured, which is the point — but a run missing
        # a face has not been judged, and the only honest colour for that is
        # red. The count is in the heading so a reader cannot skim past it.
        if: always()
        run: |
          set -euo pipefail
          judged="${{ steps.faces.outputs.judged }}"
          missing="${{ steps.faces.outputs.missing }}"
          n_missing=$(printf '%s' "$missing" | wc -w | tr -d ' ')
          echo "== conformance verdict: ${n_missing} face(s) NOT JUDGED"
          echo "   judged:     ${judged:-(none)}"
          echo "   not judged: ${missing:-(none)}"
          if [ -z "$judged" ]; then
            echo "error: no face produced results — nothing was judged at all" >&2
            exit 1
          fi
          if [ "$n_missing" != 0 ]; then
            echo "error: ${n_missing} face(s) were not measured, so this run is INCOMPLETE." >&2
            echo "       The gate's verdict above covers only: $judged" >&2
            exit 1
          fi
      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          if-no-files-found: error
          path: |
            conformance/REPORT.md
            conformance/results/
            conformance/artifacts/
