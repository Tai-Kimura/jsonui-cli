name: protocol-sync

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run unit tests
        working-directory: jui_tools
        run: python -m unittest discover -s tests -v

  idempotency:
    # Runs the protocol sync twice against the fixture project and ensures
    # no files change the second time. This is the structural guard against
    # non-deterministic generation and against edits sneaking into files that
    # the sync regenerates.
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jui_tools
        working-directory: jui_tools
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run fixture sync (first pass)
        run: |
          python -m unittest tests.test_build_sync_e2e.SyncProtocolE2ETests.test_idempotency
        working-directory: jui_tools
