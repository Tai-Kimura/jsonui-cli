[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["jsonui_doc_cli*"]

[project]
name = "jsonui-doc-cli"
version = "1.0.0"
description = "CLI tool for generating documentation from JsonUI test files and specifications"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Tai Kimura"}
]
keywords = ["jsonui", "documentation", "html", "markdown", "mermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
]

[project.scripts]
jsonui-doc = "jsonui_doc_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
